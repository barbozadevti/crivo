spring.application.name=crivo
server.port=5240

# H2 em arquivo na pasta do usuário. Para PostgreSQL, use o perfil "postgres".
spring.datasource.url=jdbc:h2:file:~/.crivo/banco;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# O esquema vem das migrações do Flyway; o Hibernate só confere se as entidades batem com ele.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.health=health

springdoc.swagger-ui.path=/swagger-ui.html

# Vagas e candidatos de exemplo na primeira execução.
crivo.demo=true
# O atalho liga para abrir o navegador sozinho.
crivo.abrir-navegador=false

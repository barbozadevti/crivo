# Crivo + PostgreSQL. Uso: docker compose up --build   ->   http://localhost:5240
services:
  banco:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: crivo
      POSTGRES_USER: crivo
      POSTGRES_PASSWORD: crivo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crivo -d crivo"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - dados:/var/lib/postgresql/data

  crivo:
    build: .
    ports:
      - "5240:5240"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      CRIVO_BANCO_URL: jdbc:postgresql://banco:5432/crivo
    depends_on:
      banco:
        condition: service_healthy

volumes:
  dados:
